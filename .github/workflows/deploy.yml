name: Deploy Automático API Pagamentos

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push da Imagem
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/api-pagamentos:${{ github.sha }}

    - name: Deploy via SSH na AWS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_TEST }}
        username: "ubuntu"
        key: ${{ secrets.KEY_TEST }}
        port: 22
        script: |
          docker stop api-pagamentos || true
          docker rm --force api-pagamentos || true
          docker image prune -f

          docker run -d \
            -p 80:5000 \
            -e MONGO_URI="${{ secrets.MONGO_URI }}" \
            --name api-pagamentos \
            ${{ secrets.DOCKER_USERNAME }}/api-pagamentos:${{ github.sha }}
