name: Deploy Automático API Cursos

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push da Imagem
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/api-cursos:${{ github.sha }}

    - name: Deploy via SSH na AWS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_TEST }}
        username: "ubuntu"
        key: ${{ secrets.KEY_TEST }}
        port: 22
        script: |
          docker network create rede || true

          if [ -z "$(docker ps -q -f name=^mongo$)" ]; then
            docker rm --force mongo || true
            docker run -d \
              --name mongo \
              --network rede \
              -v mongo-data:/data/db \
              --restart unless-stopped \
              mongo:7
          fi

          docker stop api-cursos || true
          docker rm --force api-cursos || true
          docker image prune -f

          docker run -d \
            -p 80:5000 \
            --network rede \
            -e MONGO_URI="mongodb://mongo:27017/cursos" \
            -e AUTH0_DOMAIN="${{ secrets.AUTH0_DOMAIN }}" \
            -e AUTH0_AUDIENCE="${{ secrets.AUTH0_AUDIENCE }}" \
            --restart unless-stopped \
            --name api-cursos \
            ${{ secrets.DOCKER_USERNAME }}/api-cursos:${{ github.sha }}
